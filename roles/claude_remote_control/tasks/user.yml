---
# Runs once per entry of claude_rc_users; the current user is _claude_rc_user.

- name: Look up user account {{ _claude_rc_user }}
  ansible.builtin.getent:
    database: passwd
    key: "{{ _claude_rc_user }}"
    fail_key: false

- name: Fail if the user does not exist on the host
  ansible.builtin.fail:
    msg: >-
      User "{{ _claude_rc_user }}" does not exist on {{ inventory_hostname }}.
      Create it first or remove it from claude_rc_users.
  when: (ansible_facts.getent_passwd | default({})).get(_claude_rc_user) is none

- name: Store UID and home directory
  ansible.builtin.set_fact:
    claude_rc_uid: "{{ ansible_facts.getent_passwd[_claude_rc_user][1] }}"
    claude_rc_home: "{{ ansible_facts.getent_passwd[_claude_rc_user][4] }}"

- name: Determine the effective project directory
  ansible.builtin.set_fact:
    _claude_rc_project_dir: "{{ claude_rc_home | regex_replace('/+$', '') }}/{{ _claude_rc_project_rel }}"

- name: Install Claude Code
  ansible.builtin.include_tasks: install.yml

- name: Locate the claude binary and check PATH
  ansible.builtin.include_tasks: path.yml

- name: Set up the systemd user service
  ansible.builtin.include_tasks: service.yml
