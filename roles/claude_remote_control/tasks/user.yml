---
# Runs once per present entry of claude_rc_users; the entry is _claude_rc_entry.

- name: Store the user and unit name of the entry
  ansible.builtin.set_fact:
    _claude_rc_user: "{{ _claude_rc_entry.name }}"
    _claude_rc_service: "{{ _claude_rc_entry.service }}"

- name: Look up user account {{ _claude_rc_user }}
  ansible.builtin.getent:
    database: passwd
    key: "{{ _claude_rc_user }}"
    fail_key: false

- name: Fail if the user does not exist on the host
  ansible.builtin.fail:
    msg: >-
      User "{{ _claude_rc_user }}" does not exist on {{ inventory_hostname }}.
      Create it first or remove it from claude_rc_users.
  when: (ansible_facts.getent_passwd | default({})).get(_claude_rc_user) is none

- name: Store UID and home directory
  ansible.builtin.set_fact:
    claude_rc_uid: "{{ ansible_facts.getent_passwd[_claude_rc_user][1] }}"
    claude_rc_home: "{{ ansible_facts.getent_passwd[_claude_rc_user][4] }}"

- name: Determine the effective project directory
  ansible.builtin.set_fact:
    _claude_rc_project_dir: "{{ claude_rc_home | regex_replace('/+$', '') }}/{{ _claude_rc_entry.rel }}"

# Ansible's remote_tmp for tasks run via become_user. Creating it up front
# avoids the warning that the module had to create it itself.
- name: Create the Ansible remote_tmp directory of the user
  ansible.builtin.file:
    path: "{{ claude_rc_home }}/{{ item }}"
    state: directory
    owner: "{{ _claude_rc_user }}"
    group: "{{ ansible_facts.getent_passwd[_claude_rc_user][2] }}"
    mode: "0700"
  loop:
    - .ansible
    - .ansible/tmp

- name: Install Claude Code
  ansible.builtin.include_tasks: install.yml

- name: Locate the claude binary and check PATH
  ansible.builtin.include_tasks: path.yml

- name: Set up the systemd user service
  ansible.builtin.include_tasks: service.yml
