---
- name: Reject the old single-user variable claude_rc_user
  ansible.builtin.assert:
    that:
      - claude_rc_user is not defined
    fail_msg: >-
      claude_rc_user was replaced by the list claude_rc_users. Use e.g.
      claude_rc_users: [deploy] instead.
    quiet: true

- name: Ensure the mandatory variable claude_rc_users is set
  ansible.builtin.assert:
    that:
      - claude_rc_users is defined
      - claude_rc_users is sequence
      - claude_rc_users is not string
      - claude_rc_users | length > 0
      - claude_rc_users | map('trim') | select('equalto', '') | list | length == 0
      - claude_rc_users | unique | length == claude_rc_users | length
    fail_msg: >-
      claude_rc_users is mandatory and has no default. Set it to a non-empty
      list of distinct users that should run Claude Code and the service,
      e.g. claude_rc_users: [deploy].
    quiet: true

# The project directory is always relative to each user's home directory. A
# leading "~/" is accepted and stripped.
- name: Normalize the project directory relative to the home directory
  ansible.builtin.set_fact:
    _claude_rc_project_rel: "{{ claude_rc_project_dir | trim | regex_replace('^~/', '') | regex_replace('/+$', '') }}"

# Claude Code never saves workspace trust for the home directory itself, so the
# service would fail with "Workspace not trusted" on every start.
- name: Ensure the project directory is a subdirectory of the home directory
  ansible.builtin.assert:
    that:
      - _claude_rc_project_rel | length > 0
      - _claude_rc_project_rel is not match('[/~]')
      - _claude_rc_project_rel.split('/') | select('in', ['', '.', '..']) | list | length == 0
    fail_msg: >-
      claude_rc_project_dir "{{ claude_rc_project_dir }}" must be a path
      relative to the users' home directories (e.g. claude-code-rc or
      work/claude), not absolute, not the home directory itself and without
      "." or ".." components.
    quiet: true

- name: Install required packages
  ansible.builtin.package:
    name:
      # setfacl lets Ansible share temporary modules with the target non-root user.
      - acl
      - curl
      - git
      # Provides the D-Bus session socket /run/user/<uid>/bus for user services.
      - dbus-user-session
    state: present

- name: Set up Claude Code Remote Control for each user
  ansible.builtin.include_tasks: user.yml
  loop: "{{ claude_rc_users | default([], true) }}"
  loop_control:
    loop_var: _claude_rc_user
