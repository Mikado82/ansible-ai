---
# Role argument validation (Ansible >= 2.11). Runs automatically before the
# role's tasks and fails early if a mandatory variable is missing or a value
# has the wrong type.
argument_specs:
  main:
    short_description: Set up Claude Code Remote Control as a systemd user service
    options:
      claude_rc_users:
        type: list
        elements: raw
        required: true
        description: >-
          Entries that each get Claude Code and their own service. An entry is a
          user name or a dict with the keys name (mandatory), project_dir
          (default claude_rc_project_dir) and state (present or absent).
          Mandatory, no default.
      claude_rc_project_dir:
        type: str
        default: claude-remote
        description: >-
          Default working directory of an entry, relative to the user's home
          directory (a leading "~/" is accepted). Absolute paths are rejected.
      claude_rc_service_name:
        type: str
        default: claude-rc
        description: >-
          Prefix of the systemd user units (without .service); each entry gets
          "<prefix>-<project dir with / replaced by ->".
      claude_rc_install:
        type: bool
        default: true
        description: Install Claude Code via the official installer if it is missing.
      claude_rc_binary_path:
        type: str
        default: ""
        description: Fixed path to the claude binary. Empty means detect automatically.
      claude_rc_binary_candidates:
        type: list
        elements: str
        description: Locations searched for the binary ("~" = the user's home directory).
      claude_rc_manage_path:
        type: bool
        default: true
        description: Add the binary's directory to PATH in the user's login shell if missing.
      claude_rc_extra_args:
        type: str
        default: ""
        description: Additional arguments for "claude remote-control".
      claude_rc_start:
        type: bool
        default: true
        description: Start the service as soon as a login exists.
      claude_rc_log_stdout:
        type: bool
        default: false
        description: >-
          Send the server's stdout (a status screen redrawn about once per second)
          to the journal. stderr is always logged.
      claude_rc_resume_sessions:
        type: bool
        default: true
        description: Automatically resume the previous remote sessions after a restart.
      claude_rc_stop_timeout:
        type: int
        default: 30
        description: Seconds systemd waits for a clean shutdown when stopping the service.
      claude_rc_remove_project_dir:
        type: bool
        default: false
        description: With state absent, also delete the project directory and its contents.
      claude_rc_remove_config:
        type: bool
        default: false
        description: >-
          With state absent for the last entry of a user, also delete the Claude Code
          login and configuration (~/.claude, ~/.claude.json).
