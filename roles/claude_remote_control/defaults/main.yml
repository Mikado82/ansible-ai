---
# claude_rc_users is mandatory and has no default (see meta/argument_specs.yml).
# Each entry is a user name or a dict:
#   - name: deploy            # mandatory
#     project_dir: work/api   # optional, defaults to claude_rc_project_dir
#     state: present          # optional, present (default) or absent

# Default working directory of an entry, always relative to the user's actual
# home directory (a leading "~/" is accepted). Absolute paths and the home
# directory itself are rejected.
claude_rc_project_dir: claude-remote

# Prefix of the systemd user units (without .service). Each entry gets the unit
# "<prefix>-<project dir with / replaced by ->", e.g. claude-rc-work-api.
claude_rc_service_name: claude-rc

# Install Claude Code via the official installer if it is missing
claude_rc_install: true

# Fixed path to the claude binary. Leave empty to detect it automatically.
claude_rc_binary_path: ""

# Locations searched for the binary ("~" = the user's home directory)
claude_rc_binary_candidates:
  - "~/.local/bin/claude"
  - "/usr/local/bin/claude"
  - "/usr/bin/claude"

# Add the binary's directory to PATH in the user's login shell if it is missing
# (affects interactive SSH logins only, not the service)
claude_rc_manage_path: true

# Additional arguments for "claude remote-control"
claude_rc_extra_args: ""

# Start the service as soon as a login exists
claude_rc_start: true

# Send the server's stdout to the journal. Without a TTY, "claude remote-control"
# redraws its status screen about once per second, which floods the journal with
# hundreds of thousands of lines per day. Off by default; stderr is always logged.
# The sessions are listed at claude.ai/code and in the Claude app anyway.
claude_rc_log_stdout: false

# Automatically resume the previous remote sessions after a restart (service or
# server). On startup, "claude remote-control" brings back every session the
# last server in this directory was serving, provided it was stopped cleanly via
# SIGINT (like Ctrl+C) and was offline for no more than about 4 hours. When this
# option is off, sessions are archived when the service stops.
claude_rc_resume_sessions: true

# How long systemd waits for a clean shutdown when stopping the service
claude_rc_stop_timeout: 30

# state: absent: also delete the project directory with all its contents
claude_rc_remove_project_dir: false

# state: absent for the last entry of a user: also delete the Claude Code login
# and configuration (~/.claude and ~/.claude.json)
claude_rc_remove_config: false
