# raspotify media player for Home Assistant
#
# Creates a media player entity for an audio device (e.g. an old stereo) fed by a
# Raspberry Pi running raspotify. Combines:
#   - a switch            -> on/off state and power control (e.g. a template switch
#                            using power metering + IR)
#   - raspotify webhook   -> playback state + track metadata (title, artist, cover, ...)
#   - two buttons         -> volume up/down (e.g. IR buttons from ESPHome)
#   - Spotify integration -> play/pause/next/previous
#
# Requires the HACS custom integration "Template Media Player":
#   https://github.com/EuleMitKeule/template-media-player
#
# ---------------------------------------------------------------------------
# SETTINGS - adjust these placeholders:
#
#   my_stereo / "My Stereo"             media player ID and name -> media_player.my_stereo
#   variables block of the media player:
#     switch.my_stereo_power            power switch of the device
#     button.my_stereo_volume_up        volume up button
#     button.my_stereo_volume_down      volume down button
#     media_player.spotify_my_account   entity of the Spotify integration
#     "My Stereo"                       spotify_device_name: name of the Pi in the
#                                       Spotify app (raspotify_ha_hook_device_name)
#     sensor.raspotify_my_stereo        entity of the webhook sensor below
#   raspotify_my_stereo                 webhook ID (must match raspotify_ha_hook_webhook_id)
#   "Raspotify My Stereo"               sensor name -> sensor.raspotify_my_stereo
#
# Entity IDs are set once in the media player's `variables` block and reused via
# YAML anchors (&name / *name). The media player therefore comes first in this
# file: an anchor must be defined before it is used.
# If your volume control is a script instead of a button, replace `button.press`
# with `script.turn_on` in volume_up/volume_down.
#
# How "is the Pi playing?" is decided:
#   - Display (state, title, cover): from the webhook sensor. Fast, but it only
#     knows the last event it received. It is reset to "stopped" when the switch
#     turns off and when raspotify starts or stops (service events of the role).
#   - Playback control: only if the Spotify integration reports this device as
#     the active one (attribute `source`). This comes from the Spotify cloud, so
#     a missed webhook event can never pause another device. The Spotify
#     integration polls, so `source` may lag up to ~30 s after switching devices.
#
# Automations at the end of this file (remove what you do not want):
#   - Auto power on: switches the device on as soon as Spotify plays on the Pi.
#     Triggered by the webhook sensor changing to "playing" (immediate) and, as
#     a fallback, by the Spotify integration reporting this device as source
#     (polled, slower).
#   - Auto pause: pauses Spotify when the device is switched off by any means
#     (media player, switch, its own remote detected via power metering), but
#     only if Spotify is playing on this device. The media player's turn_off
#     relies on it; without it, switching off leaves Spotify playing.
# ---------------------------------------------------------------------------

media_player:
  - platform: template_media_player
    media_players:
      my_stereo:
        unique_id: my_stereo
        name: My Stereo
        device_class: speaker
        icon: mdi:speaker
        variables:
          power_switch: &power_switch switch.my_stereo_power
          volume_up_button: &volume_up_button button.my_stereo_volume_up
          volume_down_button: &volume_down_button button.my_stereo_volume_down
          spotify_player: &spotify_player media_player.spotify_my_account
          spotify_device_name: &spotify_device_name "My Stereo"
          raspotify_sensor: &raspotify_sensor sensor.raspotify_my_stereo
        global_template: >
          {% set is_on = is_state(power_switch, 'on') %}
          {% set is_active = is_on and states(raspotify_sensor) in ['playing', 'paused'] %}
        state: >
          {% if not is_on %}off{% elif is_active %}{{ states(raspotify_sensor) }}{% else %}idle{% endif %}
        attributes:
          media_content_type: music
          media_title: "{{ state_attr(raspotify_sensor, 'title') if is_active else none }}"
          media_artist: "{{ state_attr(raspotify_sensor, 'artist') if is_active else none }}"
          media_album_name: "{{ state_attr(raspotify_sensor, 'album') if is_active else none }}"
          entity_picture: "{{ state_attr(raspotify_sensor, 'cover') if is_active else none }}"
          media_duration: "{{ state_attr(raspotify_sensor, 'duration') if is_active else none }}"
        service_scripts:
          turn_on:
            - action: switch.turn_on
              target: { entity_id: *power_switch }
          turn_off:
            # Playback is paused by the auto pause automation at the end of
            # this file, which also covers switching off by other means.
            - action: switch.turn_off
              target: { entity_id: *power_switch }
          volume_up:
            - action: button.press
              target: { entity_id: *volume_up_button }
          volume_down:
            - action: button.press
              target: { entity_id: *volume_down_button }
          media_play:
            - &spotify_on_this_device
              condition: state
              entity_id: *spotify_player
              attribute: source
              state: *spotify_device_name
            - action: media_player.media_play
              target: { entity_id: *spotify_player }
          media_pause:
            - *spotify_on_this_device
            - action: media_player.media_pause
              target: { entity_id: *spotify_player }
          media_next_track:
            - *spotify_on_this_device
            - action: media_player.media_next_track
              target: { entity_id: *spotify_player }
          media_previous_track:
            - *spotify_on_this_device
            - action: media_player.media_previous_track
              target: { entity_id: *spotify_player }

template:
  # Playback state + metadata pushed by the Pi (librespot --onevent hook and
  # raspotify service start/stop), reset when the device is switched off.
  - trigger:
      - trigger: webhook
        id: webhook
        webhook_id: raspotify_my_stereo
        allowed_methods: [POST]
        local_only: true
      - trigger: state
        id: power_off
        entity_id: *power_switch
        to: "off"
    sensor:
      - name: "Raspotify My Stereo"
        unique_id: raspotify_my_stereo
        icon: mdi:spotify
        state: >
          {% set event = trigger.json.event if trigger.id == 'webhook' else 'power_off' %}
          {% if event in ['playing', 'paused', 'stopped'] %}{{ event }}
          {% elif event in ['session_disconnected', 'service_started', 'service_stopped', 'power_off'] %}stopped
          {% else %}{{ this.state }}{% endif %}
        attributes:
          title: >
            {% set track = trigger.id == 'webhook' and trigger.json.event == 'track_changed' %}
            {{ trigger.json.title if track else this.attributes.get('title') }}
          artist: >
            {% set track = trigger.id == 'webhook' and trigger.json.event == 'track_changed' %}
            {{ trigger.json.artist if track else this.attributes.get('artist') }}
          album: >
            {% set track = trigger.id == 'webhook' and trigger.json.event == 'track_changed' %}
            {{ trigger.json.album if track else this.attributes.get('album') }}
          cover: >
            {% set track = trigger.id == 'webhook' and trigger.json.event == 'track_changed' %}
            {{ trigger.json.cover if track else this.attributes.get('cover') }}
          duration: >
            {% set track = trigger.id == 'webhook' and trigger.json.event == 'track_changed' %}
            {{ (trigger.json.duration_ms / 1000) | int if track else this.attributes.get('duration') }}

automation:
  # Switch the device on as soon as Spotify plays on the Pi.
  - id: my_stereo_auto_power_on
    alias: "My Stereo: power on when Spotify plays on it"
    mode: single
    triggers:
      - trigger: state
        entity_id: *raspotify_sensor
        to: playing
      - trigger: state
        entity_id: *spotify_player
        attribute: source
        to: *spotify_device_name
    conditions:
      - condition: state
        entity_id: *power_switch
        state: "off"
    actions:
      - action: switch.turn_on
        target: { entity_id: *power_switch }

  # Pause Spotify when the device is switched off, so it does not keep
  # playing into a switched-off device (and is not switched on again by the
  # next "playing" event). Only acts if Spotify is playing on this device;
  # the Spotify integration polls, so right after switching to the Pi
  # (up to ~30 s) the source may not match yet and nothing is paused.
  - id: my_stereo_auto_pause
    alias: "My Stereo: pause Spotify when switched off"
    mode: single
    triggers:
      - trigger: state
        entity_id: *power_switch
        from: "on"
        to: "off"
    conditions:
      - *spotify_on_this_device
      - condition: state
        entity_id: *spotify_player
        state: playing
    actions:
      - action: media_player.media_pause
        target: { entity_id: *spotify_player }
