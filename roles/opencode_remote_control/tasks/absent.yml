---
- name: Check whether the user manager is running
  ansible.builtin.stat:
    path: "/run/user/{{ _opencode_rc_entry.uid }}/bus"
  register: _opencode_rc_bus

- name: Check whether the unit exists
  ansible.builtin.stat:
    path: "{{ _opencode_rc_entry.home }}/.config/systemd/user/{{ opencode_rc_service_name }}.service"
  register: _opencode_rc_unit_stat

- name: Stop and disable the service
  ansible.builtin.systemd:
    name: "{{ opencode_rc_service_name }}.service"
    scope: user
    state: stopped
    enabled: false
  when: _opencode_rc_bus.stat.exists and _opencode_rc_unit_stat.stat.exists

- name: Remove the unit, enablement link and private server environment
  ansible.builtin.file:
    path: "{{ _opencode_rc_entry.home }}/.config/{{ item }}"
    state: absent
  loop:
    - "systemd/user/{{ opencode_rc_service_name }}.service"
    - "systemd/user/default.target.wants/{{ opencode_rc_service_name }}.service"
    - "opencode-ansible/{{ opencode_rc_service_name }}.env"
    - "opencode-ansible/{{ opencode_rc_service_name }}.applied"
  register: _opencode_rc_removed

- name: Reload the user manager after removal
  ansible.builtin.systemd:
    scope: user
    daemon_reload: true
  when: _opencode_rc_bus.stat.exists and _opencode_rc_removed is changed

- name: Remove the native installation when explicitly requested
  ansible.builtin.file:
    path: "{{ _opencode_rc_entry.home }}/{{ item }}"
    state: absent
  loop: [.opencode/bin/opencode, .opencode/bin/opencode2, .cache/opencode-ansible]
  when: opencode_rc_uninstall
