---
- name: Check whether the user manager is running
  ansible.builtin.stat:
    path: "/run/user/{{ _opencode_rc_entry.uid }}/bus"
  register: _opencode_rc_bus

- name: Stop the service and disable it if requested
  ansible.builtin.systemd:
    name: "{{ opencode_rc_service_name }}.service"
    scope: user
    daemon_reload: true
    state: stopped
    enabled: "{{ omit if opencode_rc_start else false }}"
  when: _opencode_rc_bus.stat.exists

- name: Disable the unit when its user manager is offline
  ansible.builtin.file:
    path: "{{ _opencode_rc_entry.home }}/.config/systemd/user/default.target.wants/{{ opencode_rc_service_name }}.service"
    state: absent
  when: not opencode_rc_start and not _opencode_rc_bus.stat.exists
