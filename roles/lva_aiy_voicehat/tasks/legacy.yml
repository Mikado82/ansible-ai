---
# Removes a previous manual setup, so two controllers never compete for the
# same GPIO pins.

- name: Check for legacy units
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ item }}.service"
  loop: "{{ lva_aiy_legacy_units }}"
  register: _lva_aiy_legacy_unit_stat

- name: Stop and disable legacy units
  ansible.builtin.systemd_service:
    name: "{{ item.item }}"
    state: stopped
    enabled: false
  loop: "{{ _lva_aiy_legacy_unit_stat.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item }}"

- name: Remove legacy unit files
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.service"
    state: absent
  loop: "{{ lva_aiy_legacy_units }}"
  register: _lva_aiy_legacy_unit_removed

- name: Reload systemd after removing legacy units
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: _lva_aiy_legacy_unit_removed is changed

- name: Remove legacy paths
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ lva_aiy_legacy_paths }}"
