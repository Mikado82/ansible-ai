---
# codex_rc_users is mandatory; accounts must already exist. Each entry is a user
# name or a dict with name (mandatory), work_dir (optional) and state (present
# or absent). Entries without a work_dir run in the home directory.
# Prefix of the user units; each entry gets "<prefix>-<work dir slug>".
codex_rc_service_name: codex-rc
codex_rc_release: latest
# Re-run the installer even when the binary already exists.
codex_rc_update: false
codex_rc_start: true
# state: absent for an entry with a working directory: also delete the
# directory with all its contents.
codex_rc_remove_work_dir: false
# state: absent for the last entry of an account: also delete ~/.codex
# (login, configuration and history).
codex_rc_remove_config: false
