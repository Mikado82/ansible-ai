---
- name: Use the AIY Voice HAT button and LED with Linux Voice Assistant
  hosts: all
  become: true
  roles:
    - role: lva_aiy_voicehat
      vars:
        # LVA runs in the Docker container "linux-voice-assistant", so start
        # after Docker. The container must use host networking (or publish
        # port 6055) for ws://localhost:6055 to work.
        lva_aiy_lva_unit: docker.service
        # Faint idle pulse every 10 s up to 10 % duty cycle (defaults)
        lva_aiy_idle_interval: 10.0
        lva_aiy_idle_max: 0.10
