---
- name: Install Codex CLI and configure Remote Control
  hosts: codex_remote_control
  become: true
  roles:
    - role: codex_remote_control
      vars:
        codex_rc_users:
          # Plain user name: no work_dir, so Codex uses its default path
          - agent
