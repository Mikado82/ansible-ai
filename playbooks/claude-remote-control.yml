---
- name: Set up Claude Code Remote Control
  hosts: all
  become: true
  roles:
    - role: claude_remote_control
      vars:
        claude_rc_users:
          # Plain user name: uses claude_rc_project_dir (default claude-remote)
          - deploy
          # Several project directories, each with its own service
          - name: alice
            project_dir: work/api
          - name: alice
            project_dir: work/web
          # Remove the service of this directory (contents are kept)
          # - name: alice
          #   project_dir: old-project
          #   state: absent
