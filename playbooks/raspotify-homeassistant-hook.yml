---
- name: Forward raspotify player events to Home Assistant
  hosts: all
  become: true
  roles:
    - role: raspotify_homeassistant_hook
      vars:
        raspotify_ha_hook_url: http://homeassistant.local:8123
        raspotify_ha_hook_webhook_id: raspotify_my_stereo
        # Name in the Spotify app; must match spotify_device_name in the
        # Home Assistant example package
        raspotify_ha_hook_device_name: My Stereo
